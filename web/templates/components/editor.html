{{ define "markdown_editor" }}
<!--
Markdown Editor Component (DOM-Bridge Pattern)
Parameters:
  - .Name: Form input name (e.g. "content")
  - .Value: Initial content (rendered by Go template; the textarea itself is the source of truth)
  - .Placeholder: Textarea placeholder
-->

<!-- Editor Container -->
<div x-data="markdownEditor()" class="border border-stone-200 rounded-lg overflow-hidden bg-white"
    :class="{ 'fixed inset-0 z-[100] flex flex-col rounded-none': isFullScreen }">

    <!-- Toolbar -->
    <div class="flex items-center justify-between bg-stone-50 border-b border-stone-200">
        <!-- Left: Mode Switch + Format Tools -->
        <div class="flex items-center space-x-4 min-w-0">
            <!-- Mode Switch -->
            <div class="flex flex-shrink-0 whitespace-nowrap text-sm font-medium">
                <button type="button" @click="isPreview = false" class="px-3 py-1.5 rounded-l-md transition-colors"
                    :class="!isPreview ? 'bg-white text-ink' : 'bg-stone-100 text-stone-500 hover:text-stone-700'">
                    编辑
                </button>
                <button type="button" @click="togglePreview()" class="px-3 py-1.5 rounded-r-md -ml-px transition-colors"
                    :class="isPreview ? 'bg-white text-ink' : 'bg-stone-100 text-stone-500 hover:text-stone-700'">
                    预览
                </button>
            </div>

            <!-- Format Tools：窄屏横向滚动，保证手机上也能用（含图片上传） -->
            <div class="flex items-center space-x-0.5 text-stone-500 overflow-x-auto" x-show="!isPreview">
                <button type="button" @click="prefixLines('## ')"
                    class="p-1.5 rounded hover:bg-stone-200 hover:text-ink transition-colors" title="标题 (H2)">
                    <svg class="icon w-4 h-4" aria-hidden="true"><use href="#i-heading-2"/></svg>
                </button>
                <button type="button" @click="insertText('**', '**')"
                    class="p-1.5 rounded hover:bg-stone-200 hover:text-ink transition-colors" title="加粗 (Ctrl+B)">
                    <svg class="icon w-4 h-4" aria-hidden="true"><use href="#i-bold"/></svg>
                </button>
                <button type="button" @click="insertText('*', '*')"
                    class="p-1.5 rounded hover:bg-stone-200 hover:text-ink transition-colors" title="斜体 (Ctrl+I)">
                    <svg class="icon w-4 h-4" aria-hidden="true"><use href="#i-italic"/></svg>
                </button>
                <button type="button" @click="insertText('~~', '~~')"
                    class="p-1.5 rounded hover:bg-stone-200 hover:text-ink transition-colors" title="删除线">
                    <svg class="icon w-4 h-4" aria-hidden="true"><use href="#i-strikethrough"/></svg>
                </button>
                <span class="w-px h-4 bg-stone-200 mx-1"></span>
                <button type="button" @click="prefixLines('> ')"
                    class="p-1.5 rounded hover:bg-stone-200 hover:text-ink transition-colors" title="引用">
                    <svg class="icon w-4 h-4" aria-hidden="true"><use href="#i-quote"/></svg>
                </button>
                <button type="button" @click="insertText('`', '`')"
                    class="p-1.5 rounded hover:bg-stone-200 hover:text-ink transition-colors" title="行内代码">
                    <svg class="icon w-4 h-4" aria-hidden="true"><use href="#i-code"/></svg>
                </button>
                <button type="button" @click="insertCodeBlock()"
                    class="p-1.5 rounded hover:bg-stone-200 hover:text-ink transition-colors" title="代码块">
                    <svg class="icon w-4 h-4" aria-hidden="true"><use href="#i-file-code"/></svg>
                </button>
                <span class="w-px h-4 bg-stone-200 mx-1"></span>
                <button type="button" @click="prefixLines('- ')"
                    class="p-1.5 rounded hover:bg-stone-200 hover:text-ink transition-colors" title="无序列表">
                    <svg class="icon w-4 h-4" aria-hidden="true"><use href="#i-list"/></svg>
                </button>
                <button type="button" @click="prefixLines('1. ')"
                    class="p-1.5 rounded hover:bg-stone-200 hover:text-ink transition-colors" title="有序列表">
                    <svg class="icon w-4 h-4" aria-hidden="true"><use href="#i-list-ordered"/></svg>
                </button>
                <button type="button" @click="insertLink()"
                    class="p-1.5 rounded hover:bg-stone-200 hover:text-ink transition-colors" title="链接 (Ctrl+K)">
                    <svg class="icon w-4 h-4" aria-hidden="true"><use href="#i-link"/></svg>
                </button>
                <button type="button" @click="insertText('![](', ')')"
                    class="p-1.5 rounded hover:bg-stone-200 hover:text-ink transition-colors" title="图片链接">
                    <svg class="icon w-4 h-4" aria-hidden="true"><use href="#i-image"/></svg>
                </button>
                <button type="button" @click="triggerImageUpload()" :disabled="isUploading"
                    class="p-1.5 rounded hover:bg-stone-200 hover:text-ink transition-colors relative"
                    :class="isUploading ? 'opacity-50 cursor-wait' : ''" title="上传图片 (Ctrl+V 粘贴)">
                    <svg class="icon w-4 h-4" aria-hidden="true"><use href="#i-upload"/></svg>
                    <span x-show="isUploading"
                        class="absolute -top-1 -right-1 w-2 h-2 bg-moss rounded-full animate-pulse"></span>
                </button>
                <button type="button" @click="insertRule()"
                    class="p-1.5 rounded hover:bg-stone-200 hover:text-ink transition-colors" title="分割线">
                    <svg class="icon w-4 h-4" aria-hidden="true"><use href="#i-minus"/></svg>
                </button>
            </div>
        </div>

        <!-- Right: Fullscreen Button -->
        <div class="flex flex-shrink-0 items-center space-x-2">
            <span class="hidden lg:inline whitespace-nowrap text-xs text-stone-400">支持 Markdown</span>

            <!-- Contrast Mode Button (Only in Full Screen) -->
            <button type="button" @click="toggleSplitView()" x-show="isFullScreen"
                class="p-2 rounded hover:bg-stone-200 text-stone-500 hover:text-ink transition-colors"
                :class="isSplitView ? 'bg-stone-200 text-ink' : ''" :title="isSplitView ? '关闭对照' : '对照模式'">
                <svg class="icon w-4 h-4" aria-hidden="true"><use href="#i-columns-2"/></svg>
            </button>

            <button type="button" @click="toggleFullScreen()"
                class="p-2 rounded hover:bg-stone-200 text-stone-500 hover:text-ink transition-colors"
                :title="isFullScreen ? '退出全屏' : '全屏编辑'">
                <svg x-show="!isFullScreen" class="icon w-4 h-4" aria-hidden="true"><use href="#i-maximize-2"/></svg>
                <svg x-show="isFullScreen" x-cloak class="icon w-4 h-4" aria-hidden="true"><use href="#i-minimize-2"/></svg>
            </button>
        </div>
    </div>

    <!-- Edit/Preview Area -->
    <div class="relative" :class="[
            isFullScreen ? 'flex-grow overflow-auto' : '',
            isSplitView ? 'grid grid-cols-2 gap-4 bg-stone-100' : ''
        ]">
        <!-- Editor Textarea -->
        <!-- x-ref="input" is CRITICAL for DOM-Bridge Pattern -->
        <textarea x-ref="input" name="{{ .Name }}" x-show="!isPreview || isSplitView"
            @keydown.ctrl.b.prevent="insertText('**', '**')" @keydown.meta.b.prevent="insertText('**', '**')"
            @keydown.ctrl.i.prevent="insertText('*', '*')" @keydown.meta.i.prevent="insertText('*', '*')"
            @keydown.ctrl.k.prevent="insertLink()" @keydown.meta.k.prevent="insertLink()"
            @keydown.escape="if(isFullScreen) toggleFullScreen()" @input="onInput()"
            @paste="handlePaste($event)" @scroll="syncScroll('input')" @keydown="scrollSource = 'input'"
            @mouseenter="scrollSource = 'input'" @touchstart.passive="scrollSource = 'input'"
            class="w-full p-4 md:p-6 bg-white border-0 focus:ring-0 outline-none resize-none font-mono text-sm leading-relaxed text-ink placeholder-stone-400"
            :class="[
                isFullScreen ? 'h-full' : 'min-h-[200px]',
                isSplitView ? '!h-full overflow-y-auto' : ''
            ]"
            placeholder="{{ if .Placeholder }}{{ .Placeholder }}{{ else }}在此输入内容...{{ end }}">{{ if .Value }}{{ .Value }}{{ end }}</textarea>

        <!-- Preview Area -->
        <div x-show="isPreview || isSplitView" x-cloak x-ref="preview" @scroll="syncScroll('preview')"
            @mouseenter="scrollSource = 'preview'" @touchstart.passive="scrollSource = 'preview'"
            class="prose max-w-none p-4 md:p-6 h-full overflow-y-auto bg-stone-50/50 min-h-[200px]"
            :class="isSplitView ? 'bg-white block' : ''" x-html="previewHTML">
        </div>
    </div>

    <!-- 隐藏的文件输入 -->
    <input type="file" x-ref="imageInput" @change="handleImageUpload($event)" accept="image/*" class="hidden">
</div>
{{ end }}
