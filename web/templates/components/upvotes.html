{{ define "upvotes" }}
{{/* 列表左侧的共识信号：点赞数。固定宽度不收缩，保证各行标题左对齐；没人赞的新帖显示"新"而不是一排 0 */}}
<div class="flex-shrink-0 w-8 flex flex-col items-center pt-0.5 leading-none">
    <span class="sr-only">{{ .UpvoteCount }} 个赞</span>
    {{ if gt .UpvoteCount 0 }}
    <svg class="icon w-3.5 h-3.5 text-moss fill-current" aria-hidden="true"><use href="#i-triangle"/></svg>
    <span class="mt-1 text-sm font-semibold text-green-800 tabular-nums" aria-hidden="true">{{ .UpvoteCount }}</span>
    {{ else if .IsNew }}
    <span class="mt-0.5 px-1 py-0.5 rounded bg-amber-50 text-amber-700 text-[11px] font-medium" aria-hidden="true">新</span>
    {{ else }}
    <svg class="icon w-3.5 h-3.5 text-stone-400" aria-hidden="true"><use href="#i-triangle"/></svg>
    <span class="mt-1 text-sm text-stone-500 tabular-nums" aria-hidden="true">0</span>
    {{ end }}
</div>
{{ end }}
