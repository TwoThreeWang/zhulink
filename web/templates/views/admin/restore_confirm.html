{{ template "base.html" . }}

{{ define "content" }}
<section class="py-24 md:py-32 max-w-2xl mx-auto px-4">
    <h1 class="font-sans font-bold text-2xl text-ink mb-6">恢复被 AI 拦截的文章</h1>

    <div class="bg-white border border-stone-200 rounded-lg p-5 mb-6 text-sm text-ink-light space-y-2">
        <p><span class="text-stone-400">标题：</span><span class="text-ink font-medium">{{ .Post.Title }}</span></p>
        <p><span class="text-stone-400">作者：</span><a href="/u/{{ .Post.User.ID }}" class="text-moss hover:underline">{{ .Post.User.Username }}</a></p>
        <p><span class="text-stone-400">发布时间：</span>{{ .Post.CreatedAt.Format "2006-01-02 15:04" }}</p>
        {{ if not .Post.DeletedAt.Valid }}
        <p class="text-amber-700">这篇文章当前没有被删除，确认后只会重置收录状态并解除作者的禁言。</p>
        {{ end }}
    </div>

    <p class="text-sm text-stone-500 mb-6">确认后文章会重新公开，作者的自动禁言也会解除。</p>

    <form action="/admin/post/{{ .Post.Pid }}/restore-ai-block" method="POST" class="flex items-center gap-4">
        <button type="submit"
            class="bg-moss text-white px-6 py-2.5 rounded-md font-medium hover:opacity-90 transition">确认恢复</button>
        <a href="/dashboard/notifications" class="text-sm text-stone-500 hover:text-ink transition-colors">取消</a>
    </form>
</section>
{{ end }}
