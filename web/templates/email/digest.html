<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>ZhuLink 每日回复汇总</title>
</head>

<body style="font-family: sans-serif; line-height: 1.6; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
        <p>{{ .Username }}，你好！</p>
        <p>过去 24 小时里，你有 <strong>{{ .Total }}</strong> 条新回复还没看：</p>

        {{ range .Items }}
        <div style="border-left: 4px solid #ddd; padding-left: 15px; margin: 15px 0;">
            <div><strong>{{ .Actor }}</strong> {{ .Reason }}</div>
            {{ if .Excerpt }}<div style="color: #555;">"{{ .Excerpt }}"</div>{{ end }}
            <div style="font-size: 0.8em; color: #999;">{{ .Time }}</div>
        </div>
        {{ end }}

        {{ if gt .More 0 }}<p style="color: #777;">还有 {{ .More }} 条未列出。</p>{{ end }}

        <a href="{{ .MoreLink }}"
            style="display: inline-block; padding: 10px 20px; background-color: #198240; color:white; text-decoration: none; border-radius: 4px;">查看全部通知</a>

        <p style="margin-top: 30px; font-size: 0.8em; color: #999;">
            每天汇总一次，已读的回复不会出现在邮件里。不想再收到？
            <a href="{{ .UnsubscribeURL }}" style="color: #999;">退订汇总邮件</a>，或在个人设置中关闭。
        </p>
    </div>
</body>

</html>
