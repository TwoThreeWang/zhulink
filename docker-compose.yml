version: '3.8'

services:
  # ZhuLink 应用
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zhulink
    restart: unless-stopped
    # 将宿主机的 .env 文件映射到容器中
    volumes:
      - ./.env:/app/.env:ro
    # 默认只监听本机，由宿主机上的 Nginx 等反向代理转发；直接对外暴露会绕过反代的 HTTPS 和限流。
    # 反代不在本机（或确实需要直接访问）时，在 .env 里设置 APP_BIND=0.0.0.0
    ports:
      - "${APP_BIND:-127.0.0.1}:32919:32919"
    # 如果数据库在同一 Docker 网络中,取消下面的注释并配置网络
    networks:
      - postgres_default
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:32919/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# 如果数据库在同一 Docker 网络中,取消下面的注释
networks:
  postgres_default:
    external: true
